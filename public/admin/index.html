<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#f5f9fd"
  >

  <title>Afterain · 管理后台</title>

  <style>

    :root{
      --bg:#f5f9fd;
      --panel:rgba(255,255,255,.78);
      --line:rgba(90,174,245,.18);

      --blue:#5aaef5;
      --cyan:#8bd4ff;

      --text:#172b3d;
      --muted:#71879a;

      --green:#55d5a4;
      --red:#e87979;

      --shadow:0 24px 70px rgba(66,120,160,.12);
    }

    *{
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      margin:0;
      min-height:100vh;

      background:
        radial-gradient(
          circle at 70% 0%,
          #e2f3ff 0,
          #f5f9fd 38%,
          #eef5fa 100%
        );

      color:var(--text);

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;

      overflow-x:hidden;
    }

    button,
    input,
    textarea{
      font-family:inherit;
    }

    button{
      -webkit-tap-highlight-color:transparent;
    }

    /* =========================
       Background
    ========================= */

    .bg-orb{
      position:fixed;

      width:420px;
      height:420px;

      border-radius:50%;

      filter:blur(80px);

      opacity:.22;

      pointer-events:none;

      z-index:-1;
    }

    .orb-a{
      background:#8bd4ff;

      top:-180px;
      right:2%;
    }

    .orb-b{
      background:#bceaff;

      bottom:-240px;
      left:15%;
    }

    /* =========================
       Layout
    ========================= */

    .app{
      width:min(1080px,100%);

      margin:auto;

      padding:
        42px
        28px
        calc(60px + env(safe-area-inset-bottom));
    }

    /* =========================
       Header
    ========================= */

    .topbar{
      display:flex;

      align-items:center;

      justify-content:space-between;

      gap:20px;

      margin-bottom:28px;
    }

    .brand{
      display:flex;

      align-items:center;

      gap:12px;
    }

    .brand-mark{
      width:42px;
      height:42px;

      display:grid;

      place-items:center;

      border:
        1px solid
        rgba(90,174,245,.35);

      border-radius:13px;

      background:
        linear-gradient(
          135deg,
          rgba(90,174,245,.18),
          rgba(90,174,245,.04)
        );

      color:#4a9fe8;

      font-weight:800;

      box-shadow:
        0 0 30px
        rgba(90,174,245,.12);
    }

    .brand-title{
      font-size:16px;

      font-weight:800;

      color:#193247;
    }

    .brand-subtitle{
      margin-top:3px;

      color:#91a8ba;

      font-size:8px;

      letter-spacing:.18em;
    }

    .back{
      text-decoration:none;

      color:#5f829b;

      border:
        1px solid
        rgba(90,174,245,.16);

      background:
        rgba(255,255,255,.55);

      border-radius:12px;

      padding:10px 14px;

      font-size:12px;

      transition:.2s;
    }

    .back:hover{
      color:#328bd1;

      background:
        rgba(90,174,245,.08);
    }

    /* =========================
       Login
    ========================= */

    .login{
      width:min(430px,100%);

      margin:
        13vh auto
        0;

      padding:34px;

      border-radius:26px;
    }

    .login h1{
      margin:0 0 8px;

      font-size:30px;

      letter-spacing:-.04em;

      color:#1b3449;
    }

    .login p{
      margin:0 0 26px;

      color:var(--muted);

      font-size:13px;

      line-height:1.7;
    }

    /* =========================
       Glass
    ========================= */

    .glass{
      border:
        1px solid
        var(--line);

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,.86),
          rgba(248,252,255,.72)
        );

      box-shadow:var(--shadow);

      backdrop-filter:blur(18px);

      -webkit-backdrop-filter:blur(18px);
    }

    /* =========================
       Dashboard
    ========================= */

    .dashboard{
      display:none;
    }

    .dashboard.visible{
      display:block;
    }

    .page-title{
      margin-bottom:26px;
    }

    .page-title h1{
      margin:0 0 7px;

      font-size:
        clamp(38px,6vw,54px);

      line-height:1;

      letter-spacing:-.055em;

      color:#1b3449;
    }

    .page-title p{
      margin:0;

      color:var(--muted);

      font-size:13px;

      line-height:1.7;
    }

    /* =========================
       Grid
    ========================= */

    .grid{
      display:grid;

      grid-template-columns:
        1fr 1fr;

      gap:16px;
    }

    .card{
      padding:28px;

      border-radius:24px;
    }

    .card.full{
      grid-column:1 / -1;
    }

    .card-head{
      display:flex;

      align-items:flex-start;

      justify-content:space-between;

      gap:20px;

      margin-bottom:22px;
    }

    .card-title{
      margin:0;

      color:#294359;

      font-size:19px;
    }

    .card-desc{
      margin:5px 0 0;

      color:#8aa0b1;

      font-size:11px;

      line-height:1.6;
    }

    /* =========================
       Form
    ========================= */

    label{
      display:block;

      color:#527087;

      font-size:12px;

      margin-bottom:16px;
    }

    label span{
      color:#9aafbe;
    }

    input,
    textarea{
      display:block;

      width:100%;

      margin-top:8px;

      border:
        1px solid
        rgba(90,174,245,.18);

      border-radius:13px;

      background:
        rgba(255,255,255,.72);

      color:#263f53;

      padding:13px 14px;

      font-size:13px;

      outline:none;

      transition:.2s;
    }

    textarea{
      min-height:130px;

      resize:vertical;
    }

    input:focus,
    textarea:focus{
      border-color:
        rgba(74,168,255,.55);

      box-shadow:
        0 0 0 3px
        rgba(74,168,255,.08);
    }

    /* =========================
       Buttons
    ========================= */

    .primary{
      border:0;

      border-radius:13px;

      padding:12px 18px;

      background:
        linear-gradient(
          135deg,
          #69c0fa,
          #4b9fe5
        );

      color:white;

      font-size:12px;

      font-weight:700;

      cursor:pointer;

      box-shadow:
        0 10px 28px
        rgba(24,121,220,.16);

      transition:.2s;
    }

    .primary:hover{
      filter:brightness(1.04);

      transform:translateY(-1px);
    }

    .primary:disabled{
      opacity:.55;

      cursor:not-allowed;

      transform:none;

      filter:none;
    }

    .secondary{
      border:
        1px solid
        rgba(90,174,245,.18);

      border-radius:11px;

      padding:9px 13px;

      background:
        rgba(255,255,255,.6);

      color:#5f829b;

      font-size:11px;

      cursor:pointer;

      transition:.2s;
    }

    .secondary:hover{
      background:
        rgba(90,174,245,.08);

      color:#328bd1;
    }

    .danger{
      border:
        1px solid
        rgba(232,121,121,.18);

      border-radius:11px;

      padding:9px 13px;

      background:
        rgba(232,121,121,.05);

      color:#c66f6f;

      font-size:11px;

      cursor:pointer;
    }

    .danger:hover{
      background:
        rgba(232,121,121,.10);
    }

    .actions{
      display:flex;

      gap:8px;

      flex-wrap:wrap;
    }

    /* =========================
       Status
    ========================= */

    .status-preview{
      display:flex;

      align-items:center;

      gap:14px;

      padding:15px;

      margin-top:18px;

      border-radius:16px;

      background:
        rgba(90,174,245,.055);

      border:
        1px solid
        rgba(90,174,245,.10);
    }

    .status-dot{
      width:10px;
      height:10px;

      flex:0 0 10px;

      border-radius:50%;

      background:#55d5a4;

      box-shadow:
        0 0 14px
        rgba(85,213,164,.4);
    }

    .status-preview strong{
      display:block;

      font-size:13px;

      color:#365269;
    }

    .status-preview small{
      display:block;

      margin-top:3px;

      color:#8299aa;

      font-size:10px;
    }

    /* =========================
       Moments
    ========================= */

    .moments{
      display:grid;

      gap:12px;
    }

    .moment{
      display:grid;

      grid-template-columns:
        100px 1fr auto;

      align-items:center;

      gap:16px;

      padding:14px;

      border:
        1px solid
        rgba(90,174,245,.10);

      border-radius:17px;

      background:
        rgba(255,255,255,.42);
    }

    .moment-thumb{
      width:100px;
      height:75px;

      border-radius:11px;

      overflow:hidden;

      background:#edf6fb;
    }

    .moment-thumb img{
      width:100%;
      height:100%;

      display:block;

      object-fit:cover;
    }

    .moment-thumb.empty{
      display:grid;

      place-items:center;

      color:#a2b5c2;

      font-size:10px;
    }

    .moment-info h3{
      margin:0 0 5px;

      color:#365269;

      font-size:13px;
    }

    .moment-info p{
      margin:0;

      color:#8aa0b1;

      font-size:10px;

      line-height:1.6;

      display:-webkit-box;

      -webkit-line-clamp:2;

      -webkit-box-orient:vertical;

      overflow:hidden;
    }

    .moment-date{
      margin-bottom:5px;

      color:#70a5c9;

      font-size:9px;

      letter-spacing:.1em;
    }

    /* =========================
       Image upload
    ========================= */

    .upload{
      position:relative;

      display:block;

      padding:25px 18px;

      margin-top:8px;

      text-align:center;

      border:
        1px dashed
        rgba(90,174,245,.30);

      border-radius:15px;

      background:
        rgba(90,174,245,.035);

      color:#7695aa;

      cursor:pointer;
    }

    .upload:hover{
      background:
        rgba(90,174,245,.07);
    }

    .upload input{
      position:absolute;

      width:1px;
      height:1px;

      opacity:0;
    }

    .upload strong{
      display:block;

      color:#5b9ed0;

      font-size:13px;
    }

    .upload small{
      display:block;

      margin-top:5px;

      color:#99acba;

      font-size:9px;
    }

    .upload-preview{
      display:none;

      width:100%;

      max-height:220px;

      object-fit:cover;

      margin-top:12px;

      border-radius:14px;
    }

    .upload-current{
      display:none;

      margin-top:10px;

      color:#7895aa;

      font-size:10px;

      line-height:1.6;
    }

    .upload-current.visible{
      display:block;
    }

    /* =========================
       Edit modal
    ========================= */

    .modal{
      position:fixed;

      inset:0;

      display:none;

      align-items:center;

      justify-content:center;

      padding:
        20px
        20px
        calc(
          20px +
          env(safe-area-inset-bottom)
        );

      background:
        rgba(25,50,70,.20);

      backdrop-filter:blur(8px);

      -webkit-backdrop-filter:blur(8px);

      z-index:1000;
    }

    .modal.visible{
      display:flex;
    }

    .modal-card{
      width:min(560px,100%);

      max-height:
        calc(100vh - 40px);

      overflow:auto;

      padding:28px;

      border-radius:24px;
    }

    .modal-head{
      display:flex;

      align-items:flex-start;

      justify-content:space-between;

      gap:20px;

      margin-bottom:22px;
    }

    .modal-head h2{
      margin:0;

      color:#294359;

      font-size:20px;
    }

    .modal-close{
      width:32px;
      height:32px;

      border:
        1px solid
        rgba(90,174,245,.15);

      border-radius:10px;

      background:
        rgba(255,255,255,.6);

      color:#7895aa;

      cursor:pointer;

      font-size:16px;
    }

    .modal-actions{
      display:flex;

      justify-content:flex-end;

      gap:8px;

      margin-top:20px;
    }

    /* =========================
       Message
    ========================= */

    .message{
      min-height:18px;

      margin-top:13px;

      font-size:11px;

      color:#7895aa;
    }

    .message.success{
      color:#4fae8b;
    }

    .message.error{
      color:#c66f6f;
    }

    /* =========================
       Logout
    ========================= */

    .logout{
      color:#8298a9;

      background:none;

      border:0;

      padding:4px;

      font-size:11px;

      cursor:pointer;
    }

    .logout:hover{
      color:#c66f6f;
    }

    /* =========================
       Mobile
    ========================= */

    @media(max-width:760px){

      .app{
        padding:
          22px 15px
          calc(
            45px +
            env(safe-area-inset-bottom)
          );
      }

      .topbar{
        margin-bottom:24px;
      }

      .back{
        padding:9px 11px;

        font-size:10px;
      }

      .grid{
        grid-template-columns:1fr;
      }

      .card.full{
        grid-column:auto;
      }

      .card{
        padding:21px;

        border-radius:20px;
      }

      .page-title h1{
        font-size:40px;
      }

      .page-title p{
        font-size:11px;
      }

      .moment{
        grid-template-columns:
          72px 1fr;
        gap:12px;
      }

      .moment-thumb{
        width:72px;
        height:60px;
      }

      .moment .actions{
        grid-column:2;

        margin-top:-3px;
      }

      .login{
        margin-top:10vh;

        padding:25px;

        border-radius:22px;
      }

      .login h1{
        font-size:27px;
      }

      .modal-card{
        padding:22px;

        border-radius:20px;
      }

    }

  </style>
</head>

<body>

  <div class="bg-orb orb-a"></div>
  <div class="bg-orb orb-b"></div>


  <!-- =====================================================
       Login
  ====================================================== -->

  <section
    id="loginView"
    class="login glass"
  >

    <div class="brand">

      <div class="brand-mark">
        A
      </div>

      <div>

        <div class="brand-title">
          Afterain
        </div>

        <div class="brand-subtitle">
          PRIVATE SPACE
        </div>

      </div>

    </div>


    <div style="height:28px"></div>


    <h1>
      管理后台
    </h1>


    <p>
      这是你的私人管理空间。
      登录后可以修改状态、发布和管理动态。
    </p>


    <form id="loginForm">

      <label>

        管理密码

        <input
          id="password"
          type="password"
          autocomplete="current-password"
          placeholder="输入管理员密码"
          required
        >

      </label>


      <button
        id="loginButton"
        class="primary"
        type="submit"
        style="width:100%"
      >
        登录
      </button>


      <div
        id="loginMessage"
        class="message"
      ></div>

    </form>

  </section>


  <!-- =====================================================
       Dashboard
  ====================================================== -->

  <main
    id="dashboard"
    class="dashboard"
  >

    <div class="app">


      <!-- Header -->

      <header class="topbar">

        <div class="brand">

          <div class="brand-mark">
            A
          </div>

          <div>

            <div class="brand-title">
              Afterain
            </div>

            <div class="brand-subtitle">
              ADMINISTRATION
            </div>

          </div>

        </div>


        <div class="actions">

          <a
            class="back"
            href="/"
          >
            ← 返回网站
          </a>

          <button
            id="logoutButton"
            class="logout"
            type="button"
          >
            退出
          </button>

        </div>

      </header>


      <!-- Page title -->

      <div class="page-title">

        <h1>
          管理后台
        </h1>

        <p>
          在这里管理你的状态与照片动态。
        </p>

      </div>


      <div class="grid">


        <!-- =================================================
             Status
        ================================================== -->

        <section class="card glass">

          <div class="card-head">

            <div>

              <h2 class="card-title">
                当前状态
              </h2>

              <p class="card-desc">
                修改首页正在做什么。
              </p>

            </div>

          </div>


          <form id="statusForm">

            <label>

              状态标题

              <input
                id="statusTitle"
                type="text"
                maxlength="80"
                placeholder="例如：正在专心做自己的事情"
                required
              >

            </label>


            <label>

              状态说明

              <textarea
                id="statusDetail"
                maxlength="300"
                placeholder="简单说说你现在在做什么……"
                required
              ></textarea>

            </label>


            <button
              id="statusButton"
              class="primary"
              type="submit"
            >
              保存状态
            </button>


            <div
              id="statusMessage"
              class="message"
            ></div>

          </form>


          <div class="status-preview">

            <span class="status-dot"></span>

            <div>

              <strong
                id="statusPreviewTitle"
              >
                --
              </strong>

              <small
                id="statusPreviewDetail"
              >
                --
              </small>

            </div>

          </div>

        </section>


        <!-- =================================================
             New Moment
        ================================================== -->

        <section class="card glass">

          <div class="card-head">

            <div>

              <h2 class="card-title">
                发布动态
              </h2>

              <p class="card-desc">
                留下一段值得记住的时间。
              </p>

            </div>

          </div>


          <form id="momentForm">

            <label>

              日期

              <input
                id="momentDate"
                type="date"
                required
              >

            </label>


            <label>

              标题

              <input
                id="momentTitle"
                type="text"
                maxlength="100"
                placeholder="这一天发生了什么？"
                required
              >

            </label>


            <label>

              图片

              <span>
                （可选）
              </span>

              <label class="upload">

                <input
                  id="momentImage"
                  type="file"
                  accept="image/*"
                >

                <strong>
                  ＋ 选择照片
                </strong>

                <small>
                  图片将上传到 Cloudinary，最大 10 MB
                </small>

              </label>


              <img
                id="imagePreview"
                class="upload-preview"
                alt=""
              >

            </label>


            <label>

              说明

              <textarea
                id="momentDescription"
                maxlength="500"
                placeholder="写下这张照片背后的故事……"
              ></textarea>

            </label>


            <button
              id="momentButton"
              class="primary"
              type="submit"
            >
              发布动态
            </button>


            <div
              id="momentMessage"
              class="message"
            ></div>

          </form>

        </section>


        <!-- =================================================
             Moments
        ================================================== -->

        <section class="card glass full">

          <div class="card-head">

            <div>

              <h2 class="card-title">
                已发布动态
              </h2>

              <p class="card-desc">
                编辑或者删除已经发布的内容。
              </p>

            </div>


            <button
              id="refreshButton"
              class="secondary"
              type="button"
            >
              刷新
            </button>

          </div>


          <div
            id="moments"
            class="moments"
          >

            <div
              style="
                padding:30px;
                text-align:center;
                color:#91a8ba;
                font-size:12px;
              "
            >
              正在加载……
            </div>

          </div>

        </section>

      </div>

    </div>

  </main>


  <!-- =====================================================
       Edit Modal
  ====================================================== -->

  <div
    id="editModal"
    class="modal"
  >

    <div class="modal-card glass">

      <div class="modal-head">

        <div>

          <h2>
            编辑动态
          </h2>

          <p
            class="card-desc"
            style="margin-top:6px"
          >
            修改这条动态的内容。
          </p>

        </div>


        <button
          id="closeEditButton"
          class="modal-close"
          type="button"
          aria-label="关闭"
        >
          ×
        </button>

      </div>


      <form id="editForm">

        <input
          id="editId"
          type="hidden"
        >


        <label>

          日期

          <input
            id="editDate"
            type="date"
            required
          >

        </label>


        <label>

          标题

          <input
            id="editTitle"
            type="text"
            maxlength="100"
            required
          >

        </label>


        <label>

          图片

          <label class="upload">

            <input
              id="editImage"
              type="file"
              accept="image/*"
            >

            <strong>
              ＋ 更换照片
            </strong>

            <small>
              不选择新图片则保留原图片
            </small>

          </label>


          <img
            id="editImagePreview"
            class="upload-preview"
            alt=""
          >


          <div
            id="editCurrentImage"
            class="upload-current"
          ></div>

        </label>


        <label>

          说明

          <textarea
            id="editDescription"
            maxlength="500"
          ></textarea>

        </label>


        <div
          id="editMessage"
          class="message"
        ></div>


        <div class="modal-actions">

          <button
            id="cancelEditButton"
            class="secondary"
            type="button"
          >
            取消
          </button>


          <button
            id="saveEditButton"
            class="primary"
            type="submit"
          >
            保存修改
          </button>

        </div>

      </form>

    </div>

  </div>


  <script>

    /*
     * =====================================================
     * Afterain Admin
     * =====================================================
     *
     * Worker API:
     *
     * POST   /api/admin/login
     * POST   /api/admin/logout
     * GET    /api/admin/session
     *
     * GET    /api/admin/status
     * PUT    /api/admin/status
     *
     * GET    /api/admin/moments
     * POST   /api/admin/moments
     * PUT    /api/admin/moments/:id
     * DELETE /api/admin/moments/:id
     *
     * POST   /api/admin/upload
     *
     * Session:
     *
     * HttpOnly Cookie
     *
     * Storage:
     *
     * AFTERAIN_SITE KV
     *
     * Images:
     *
     * Cloudinary
     */


    const API = "/api/admin";


    /* =====================================================
       Elements
    ===================================================== */

    const loginView =
      document.getElementById(
        "loginView"
      );

    const dashboard =
      document.getElementById(
        "dashboard"
      );

    const loginForm =
      document.getElementById(
        "loginForm"
      );

    const passwordInput =
      document.getElementById(
        "password"
      );

    const loginButton =
      document.getElementById(
        "loginButton"
      );

    const loginMessage =
      document.getElementById(
        "loginMessage"
      );


    const statusForm =
      document.getElementById(
        "statusForm"
      );

    const statusTitle =
      document.getElementById(
        "statusTitle"
      );

    const statusDetail =
      document.getElementById(
        "statusDetail"
      );

    const statusButton =
      document.getElementById(
        "statusButton"
      );

    const statusMessage =
      document.getElementById(
        "statusMessage"
      );

    const statusPreviewTitle =
      document.getElementById(
        "statusPreviewTitle"
      );

    const statusPreviewDetail =
      document.getElementById(
        "statusPreviewDetail"
      );


    const momentForm =
      document.getElementById(
        "momentForm"
      );

    const momentDate =
      document.getElementById(
        "momentDate"
      );

    const momentTitle =
      document.getElementById(
        "momentTitle"
      );

    const momentImage =
      document.getElementById(
        "momentImage"
      );

    const momentDescription =
      document.getElementById(
        "momentDescription"
      );

    const momentButton =
      document.getElementById(
        "momentButton"
      );

    const momentMessage =
      document.getElementById(
        "momentMessage"
      );

    const imagePreview =
      document.getElementById(
        "imagePreview"
      );


    const moments =
      document.getElementById(
        "moments"
      );

    const refreshButton =
      document.getElementById(
        "refreshButton"
      );


    const logoutButton =
      document.getElementById(
        "logoutButton"
      );


    /* =====================================================
       Edit elements
    ===================================================== */

    const editModal =
      document.getElementById(
        "editModal"
      );

    const editForm =
      document.getElementById(
        "editForm"
      );

    const editId =
      document.getElementById(
        "editId"
      );

    const editDate =
      document.getElementById(
        "editDate"
      );

    const editTitle =
      document.getElementById(
        "editTitle"
      );

    const editImage =
      document.getElementById(
        "editImage"
      );

    const editImagePreview =
      document.getElementById(
        "editImagePreview"
      );

    const editCurrentImage =
      document.getElementById(
        "editCurrentImage"
      );

    const editDescription =
      document.getElementById(
        "editDescription"
      );

    const editMessage =
      document.getElementById(
        "editMessage"
      );

    const saveEditButton =
      document.getElementById(
        "saveEditButton"
      );

    const closeEditButton =
      document.getElementById(
        "closeEditButton"
      );

    const cancelEditButton =
      document.getElementById(
        "cancelEditButton"
      );


    /* =====================================================
       State
    ===================================================== */

    let currentMoments = [];

    let editOriginalImage = "";

    let editOriginalPublicId = "";

    let editPreviewObjectUrl = null;

    let createPreviewObjectUrl = null;


    /* =====================================================
       Helpers
    ===================================================== */

    function showMessage(
      element,
      text,
      type = ""
    ){

      element.textContent =
        text || "";

      element.className =
        "message" +
        (
          type
            ? ` ${type}`
            : ""
        );

    }


    function setButtonLoading(
      button,
      loading,
      loadingText,
      normalText
    ){

      button.disabled =
        loading;

      button.textContent =
        loading
          ? loadingText
          : normalText;

    }


    async function parseResponse(
      response
    ){

      let data = null;

      try{

        data =
          await response.json();

      }catch{

        data = {};

      }


      if(
        response.status === 401
      ){

        await handleSessionExpired();

        throw new Error(
          data.error ||
          "登录已过期"
        );

      }


      if(!response.ok){

        throw new Error(
          data.error ||
          "请求失败"
        );

      }


      return data;

    }


    async function api(
      path,
      options = {}
    ){

      const headers = {
        ...(options.body instanceof FormData
          ? {}
          : {
              "content-type":
                "application/json"
            }),

        ...(options.headers || {})
      };


      const response =
        await fetch(
          API + path,
          {
            credentials:
              "include",

            ...options,

            headers
          }
        );


      return await parseResponse(
        response
      );

    }


    /* =====================================================
       Session
    ===================================================== */

    async function checkSession(){

      try{

        const data =
          await api(
            "/session",
            {
              method:"GET"
            }
          );


        if(
          data.authenticated
        ){

          showDashboard();

          await loadAll();

          return true;

        }

      }catch{

        // 未登录属于正常情况
      }


      showLogin();

      return false;

    }


    function showDashboard(){

      loginView.style.display =
        "none";

      dashboard.classList.add(
        "visible"
      );

    }


    function showLogin(){

      dashboard.classList.remove(
        "visible"
      );

      loginView.style.display =
        "block";

    }


    async function handleSessionExpired(){

      showLogin();

      showMessage(
        loginMessage,
        "登录已过期，请重新登录。",
        "error"
      );

    }


    /* =====================================================
       Login
    ===================================================== */

    loginForm.addEventListener(
      "submit",
      async event => {

        event.preventDefault();


        showMessage(
          loginMessage,
          "正在登录……"
        );


        setButtonLoading(
          loginButton,
          true,
          "登录中……",
          "登录"
        );


        try{

          await api(
            "/login",
            {
              method:"POST",

              body:
                JSON.stringify({
                  password:
                    passwordInput.value
                })
            }
          );


          passwordInput.value =
            "";

          showMessage(
            loginMessage,
            ""
          );


          showDashboard();

          await loadAll();


        }catch(error){

          showMessage(
            loginMessage,
            error.message,
            "error"
          );

        }finally{

          setButtonLoading(
            loginButton,
            false,
            "登录中……",
            "登录"
          );

        }

      }
    );


    /* =====================================================
       Status
    ===================================================== */

    async function loadStatus(){

      const data =
        await api(
          "/status",
          {
            method:"GET"
          }
        );


      const status =
        data.status || {};


      statusTitle.value =
        status.title || "";

      statusDetail.value =
        status.detail || "";


      statusPreviewTitle.textContent =
        status.title || "--";

      statusPreviewDetail.textContent =
        status.detail || "--";

    }


    statusForm.addEventListener(
      "submit",
      async event => {

        event.preventDefault();


        showMessage(
          statusMessage,
          "正在保存……"
        );


        setButtonLoading(
          statusButton,
          true,
          "保存中……",
          "保存状态"
        );


        try{

          await api(
            "/status",
            {
              method:"PUT",

              body:
                JSON.stringify({

                  title:
                    statusTitle.value
                      .trim(),

                  detail:
                    statusDetail.value
                      .trim()

                })
            }
          );


          showMessage(
            statusMessage,
            "状态已更新。",
            "success"
          );


          await loadStatus();


        }catch(error){

          showMessage(
            statusMessage,
            error.message,
            "error"
          );

        }finally{

          setButtonLoading(
            statusButton,
            false,
            "保存中……",
            "保存状态"
          );

        }

      }
    );


    /* =====================================================
       Image preview
    ===================================================== */

    function clearCreatePreview(){

      if(
        createPreviewObjectUrl
      ){

        URL.revokeObjectURL(
          createPreviewObjectUrl
        );

        createPreviewObjectUrl =
          null;

      }


      imagePreview.src =
        "";

      imagePreview.style.display =
        "none";

    }


    momentImage.addEventListener(
      "change",
      () => {

        clearCreatePreview();


        const file =
          momentImage.files?.[0];


        if(!file){

          return;

        }


        createPreviewObjectUrl =
          URL.createObjectURL(
            file
          );


        imagePreview.src =
          createPreviewObjectUrl;

        imagePreview.style.display =
          "block";

      }
    );


    /* =====================================================
       Cloudinary upload
    ===================================================== */

    async function uploadImage(
      file
    ){

      const form =
        new FormData();


      form.append(
        "file",
        file
      );


      const response =
        await fetch(
          API + "/upload",
          {
            method:"POST",

            credentials:
              "include",

            body:form
          }
        );


      return await parseResponse(
        response
      );

    }


    /* =====================================================
       Create Moment
    ===================================================== */

    momentForm.addEventListener(
      "submit",
      async event => {

        event.preventDefault();


        showMessage(
          momentMessage,
          "正在发布……"
        );


        setButtonLoading(
          momentButton,
          true,
          "发布中……",
          "发布动态"
        );


        try{

          let image = "";

          let imagePublicId = "";


          const file =
            momentImage.files?.[0];


          if(file){

            showMessage(
              momentMessage,
              "正在上传图片……"
            );


            const uploadResult =
              await uploadImage(
                file
              );


            image =
              uploadResult.url ||
              "";

            imagePublicId =
              uploadResult.publicId ||
              "";

          }


          showMessage(
            momentMessage,
            "正在保存动态……"
          );


          await api(
            "/moments",
            {
              method:"POST",

              body:
                JSON.stringify({

                  date:
                    momentDate.value,

                  title:
                    momentTitle.value
                      .trim(),

                  description:
                    momentDescription.value
                      .trim(),

                  image,

                  imagePublicId

                })
            }
          );


          showMessage(
            momentMessage,
            "动态发布成功。",
            "success"
          );


          momentForm.reset();


          clearCreatePreview();


          setDefaultCreateDate();


          await loadMoments();


        }catch(error){

          showMessage(
            momentMessage,
            error.message,
            "error"
          );

        }finally{

          setButtonLoading(
            momentButton,
            false,
            "发布中……",
            "发布动态"
          );

        }

      }
    );


    /* =====================================================
       Moments
    ===================================================== */

    async function loadMoments(){

      moments.innerHTML = `
        <div style="
          padding:30px;
          text-align:center;
          color:#91a8ba;
          font-size:12px;
        ">
          正在加载……
        </div>
      `;


      try{

        const data =
          await api(
            "/moments",
            {
              method:"GET"
            }
          );


        currentMoments =
          Array.isArray(
            data.moments
          )
            ? data.moments
            : [];


        renderMoments(
          currentMoments
        );


      }catch(error){

        moments.innerHTML = `
          <div style="
            padding:30px;
            text-align:center;
            color:#c66f6f;
            font-size:12px;
          ">
            ${escapeHtml(
              error.message
            )}
          </div>
        `;

      }

    }


    function renderMoments(
      list
    ){

      if(!list.length){

        moments.innerHTML = `
          <div style="
            padding:35px;
            text-align:center;
            color:#91a8ba;
            font-size:12px;
          ">
            还没有发布任何动态。
          </div>
        `;

        return;

      }


      moments.innerHTML =
        list
          .map(
            moment => {

              const image =
                moment.image
                  ? `
                    <img
                      src="${escapeAttribute(
                        moment.image
                      )}"
                      alt=""
                      loading="lazy"
                    >
                  `
                  : "无图片";


              return `
                <article
                  class="moment"
                  data-id="${escapeAttribute(
                    moment.id
                  )}"
                >

                  <div class="
                    moment-thumb
                    ${
                      moment.image
                        ? ""
                        : "empty"
                    }
                  ">
                    ${image}
                  </div>


                  <div
                    class="moment-info"
                  >

                    <div
                      class="moment-date"
                    >
                      ${escapeHtml(
                        moment.date ||
                        ""
                      )}
                    </div>


                    <h3>
                      ${escapeHtml(
                        moment.title ||
                        ""
                      )}
                    </h3>


                    <p>
                      ${escapeHtml(
                        moment.description ||
                        ""
                      )}
                    </p>

                  </div>


                  <div
                    class="actions"
                  >

                    <button
                      class="secondary"
                      type="button"
                      data-action="edit"
                      data-id="${escapeAttribute(
                        moment.id
                      )}"
                    >
                      编辑
                    </button>


                    <button
                      class="danger"
                      type="button"
                      data-action="delete"
                      data-id="${escapeAttribute(
                        moment.id
                      )}"
                    >
                      删除
                    </button>

                  </div>

                </article>
              `;

            }
          )
          .join("");

    }


    /* =====================================================
       Moment actions
    ===================================================== */

    moments.addEventListener(
      "click",
      event => {

        const button =
          event.target.closest(
            "button[data-action]"
          );


        if(!button){

          return;

        }


        const id =
          button.dataset.id;


        const action =
          button.dataset.action;


        if(!id){

          return;

        }


        if(
          action === "edit"
        ){

          openEditModal(id);

          return;

        }


        if(
          action === "delete"
        ){

          deleteMoment(id);

        }

      }
    );


    /* =====================================================
       Delete Moment
    ===================================================== */

    async function deleteMoment(
      id
    ){

      const moment =
        currentMoments.find(
          item =>
            item.id === id
        );


      if(!moment){

        return;

      }


      const confirmed =
        window.confirm(
          `确定要删除「${
            moment.title || "这条动态"
          }」吗？\n\n如果包含图片，Cloudinary 上的图片也会被删除。`
        );


      if(!confirmed){

        return;

      }


      try{

        await api(
          `/moments/${encodeURIComponent(
            id
          )}`,
          {
            method:"DELETE"
          }
        );


        await loadMoments();


      }catch(error){

        window.alert(
          error.message
        );

      }

    }


    /* =====================================================
       Edit modal
    ===================================================== */

    function openEditModal(
      id
    ){

      const moment =
        currentMoments.find(
          item =>
            item.id === id
        );


      if(!moment){

        return;

      }


      editId.value =
        moment.id || "";

      editDate.value =
        moment.date || "";

      editTitle.value =
        moment.title || "";

      editDescription.value =
        moment.description || "";


      editOriginalImage =
        moment.image || "";

      editOriginalPublicId =
        moment.imagePublicId || "";


      editImage.value =
        "";


      clearEditPreview();


      if(
        editOriginalImage
      ){

        editCurrentImage.innerHTML = `
          当前图片：
          <a
            href="${escapeAttribute(
              editOriginalImage
            )}"
            target="_blank"
            rel="noopener noreferrer"
            style="
              color:#5b9ed0;
              text-decoration:none;
            "
          >
            查看原图
          </a>
        `;

        editCurrentImage.classList.add(
          "visible"
        );

      }else{

        editCurrentImage.textContent =
          "当前没有图片。";

        editCurrentImage.classList.add(
          "visible"
        );

      }


      showMessage(
        editMessage,
        ""
      );


      editModal.classList.add(
        "visible"
      );


      document.body.style.overflow =
        "hidden";

    }


    function closeEditModal(){

      editModal.classList.remove(
        "visible"
      );

      document.body.style.overflow =
        "";

      clearEditPreview();

      editForm.reset();

      editOriginalImage =
        "";

      editOriginalPublicId =
        "";

    }


    function clearEditPreview(){

      if(
        editPreviewObjectUrl
      ){

        URL.revokeObjectURL(
          editPreviewObjectUrl
        );

        editPreviewObjectUrl =
          null;

      }


      editImagePreview.src =
        "";

      editImagePreview.style.display =
        "none";

    }


    editImage.addEventListener(
      "change",
      () => {

        clearEditPreview();


        const file =
          editImage.files?.[0];


        if(!file){

          return;

        }


        editPreviewObjectUrl =
          URL.createObjectURL(
            file
          );


        editImagePreview.src =
          editPreviewObjectUrl;

        editImagePreview.style.display =
          "block";

      }
    );


    closeEditButton.addEventListener(
      "click",
      closeEditModal
    );


    cancelEditButton.addEventListener(
      "click",
      closeEditModal
    );


    editModal.addEventListener(
      "click",
      event => {

        if(
          event.target ===
          editModal
        ){

          closeEditModal();

        }

      }
    );


    document.addEventListener(
      "keydown",
      event => {

        if(
          event.key === "Escape" &&
          editModal.classList.contains(
            "visible"
          )
        ){

          closeEditModal();

        }

      }
    );


    /* =====================================================
       Save edited Moment
    ===================================================== */

    editForm.addEventListener(
      "submit",
      async event => {

        event.preventDefault();


        const id =
          editId.value;


        if(!id){

          return;

        }


        setButtonLoading(
          saveEditButton,
          true,
          "保存中……",
          "保存修改"
        );


        showMessage(
          editMessage,
          "正在保存……"
        );


        try{

          let image =
            editOriginalImage;

          let imagePublicId =
            editOriginalPublicId;


          const newFile =
            editImage.files?.[0];


          /*
           * 如果选择了新图片：
           *
           * 1. 上传新图片
           * 2. 保存新的 URL
           * 3. 保存新的 publicId
           *
           * Worker 修改完成后，
           * 如果需要可以再清理旧图片。
           */

          if(newFile){

            showMessage(
              editMessage,
              "正在上传新图片……"
            );


            const uploadResult =
              await uploadImage(
                newFile
              );


            image =
              uploadResult.url ||
              "";

            imagePublicId =
              uploadResult.publicId ||
              "";

          }


          showMessage(
            editMessage,
            "正在保存动态……"
          );


          await api(
            `/moments/${encodeURIComponent(
              id
            )}`,
            {
              method:"PUT",

              body:
                JSON.stringify({

                  date:
                    editDate.value,

                  title:
                    editTitle.value
                      .trim(),

                  description:
                    editDescription.value
                      .trim(),

                  image,

                  imagePublicId

                })
            }
          );


          showMessage(
            editMessage,
            "修改成功。",
            "success"
          );


          await loadMoments();


          setTimeout(
            () => {

              closeEditModal();

            },
            450
          );


        }catch(error){

          showMessage(
            editMessage,
            error.message,
            "error"
          );

        }finally{

          setButtonLoading(
            saveEditButton,
            false,
            "保存中……",
            "保存修改"
          );

        }

      }
    );


    /* =====================================================
       Refresh
    ===================================================== */

    refreshButton.addEventListener(
      "click",
      async () => {

        refreshButton.disabled =
          true;

        refreshButton.textContent =
          "刷新中……";


        try{

          await loadAll();

        }finally{

          refreshButton.disabled =
            false;

          refreshButton.textContent =
            "刷新";

        }

      }
    );


    async function loadAll(){

      await Promise.all([
        loadStatus(),
        loadMoments()
      ]);

    }


    /* =====================================================
       Logout
    ===================================================== */

    logoutButton.addEventListener(
      "click",
      logout
    );


    async function logout(){

      logoutButton.disabled =
        true;


      try{

        await fetch(
          API + "/logout",
          {
            method:"POST",

            credentials:
              "include"
          }
        );

      }catch{

        // 即使请求失败，
        // 也立即退出前端界面

      }


      logoutButton.disabled =
        false;


      showLogin();


      showMessage(
        loginMessage,
        "已退出登录。",
        "success"
      );


      passwordInput.value =
        "";

    }


    /* =====================================================
       XSS protection
    ===================================================== */

    function escapeHtml(
      value = ""
    ){

      return String(value)
        .replace(
          /[&<>"']/g,
          char =>
            ({
              "&":"&amp;",
              "<":"&lt;",
              ">":"&gt;",
              '"':"&quot;",
              "'":"&#039;"
            })[char]
        );

    }


    function escapeAttribute(
      value = ""
    ){

      return escapeHtml(
        value
      )
        .replace(
          /`/g,
          "&#096;"
        );

    }


    /* =====================================================
       Default date
    ===================================================== */

    function getLocalDate(){

      const now =
        new Date();


      const year =
        now.getFullYear();


      const month =
        String(
          now.getMonth() + 1
        ).padStart(
          2,
          "0"
        );


      const day =
        String(
          now.getDate()
        ).padStart(
          2,
          "0"
        );


      return `${year}-${month}-${day}`;

    }


    function setDefaultCreateDate(){

      momentDate.value =
        getLocalDate();

    }


    /* =====================================================
       Startup
    ===================================================== */

    setDefaultCreateDate();


    /*
     * 页面打开：
     *
     * 1. 检查 HttpOnly Session Cookie
     * 2. 有效 → 直接进入后台
     * 3. 无效 → 显示登录
     */

    checkSession();

  </script>

</body>
</html>
