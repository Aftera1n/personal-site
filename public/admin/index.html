<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta name="theme-color" content="#f5f9fd">

  <title>Afterain · 管理后台</title>

  <style>

    :root{
      --bg:#f5f9fd;
      --panel:rgba(255,255,255,.78);
      --line:rgba(90,174,245,.18);

      --blue:#5aaef5;
      --cyan:#8bd4ff;

      --text:#172b3d;
      --muted:#71879a;

      --green:#55d5a4;
      --red:#e87979;

      --shadow:0 24px 70px rgba(66,120,160,.12);
    }

    *{
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      margin:0;
      min-height:100vh;

      background:
        radial-gradient(
          circle at 70% 0%,
          #e2f3ff 0,
          #f5f9fd 38%,
          #eef5fa 100%
        );

      color:var(--text);

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;

      overflow-x:hidden;
    }

    /* =========================
       Background
    ========================= */

    .bg-orb{
      position:fixed;

      width:420px;
      height:420px;

      border-radius:50%;

      filter:blur(80px);

      opacity:.22;

      pointer-events:none;

      z-index:-1;
    }

    .orb-a{
      background:#8bd4ff;

      top:-180px;
      right:2%;
    }

    .orb-b{
      background:#bceaff;

      bottom:-240px;
      left:15%;
    }

    /* =========================
       Layout
    ========================= */

    .app{
      width:min(1080px,100%);

      margin:auto;

      padding:
        42px
        28px
        calc(60px + env(safe-area-inset-bottom));
    }

    /* =========================
       Header
    ========================= */

    .topbar{
      display:flex;

      align-items:center;

      justify-content:space-between;

      gap:20px;

      margin-bottom:28px;
    }

    .brand{
      display:flex;

      align-items:center;

      gap:12px;
    }

    .brand-mark{
      width:42px;
      height:42px;

      display:grid;

      place-items:center;

      border:
        1px solid
        rgba(90,174,245,.35);

      border-radius:13px;

      background:
        linear-gradient(
          135deg,
          rgba(90,174,245,.18),
          rgba(90,174,245,.04)
        );

      color:#4a9fe8;

      font-weight:800;

      box-shadow:
        0 0 30px
        rgba(90,174,245,.12);
    }

    .brand-title{
      font-size:16px;

      font-weight:800;

      color:#193247;
    }

    .brand-subtitle{
      margin-top:3px;

      color:#91a8ba;

      font-size:8px;

      letter-spacing:.18em;
    }

    .back{
      text-decoration:none;

      color:#5f829b;

      border:
        1px solid
        rgba(90,174,245,.16);

      background:
        rgba(255,255,255,.55);

      border-radius:12px;

      padding:10px 14px;

      font-size:12px;

      transition:.2s;
    }

    .back:hover{
      color:#328bd1;

      background:
        rgba(90,174,245,.08);
    }

    /* =========================
       Login
    ========================= */

    .login{
      width:min(430px,100%);

      margin:
        13vh auto
        0;

      padding:34px;

      border-radius:26px;
    }

    .login h1{
      margin:0 0 8px;

      font-size:30px;

      letter-spacing:-.04em;

      color:#1b3449;
    }

    .login p{
      margin:0 0 26px;

      color:var(--muted);

      font-size:13px;

      line-height:1.7;
    }

    /* =========================
       Glass
    ========================= */

    .glass{
      border:
        1px solid
        var(--line);

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,.86),
          rgba(248,252,255,.72)
        );

      box-shadow:var(--shadow);

      backdrop-filter:blur(18px);

      -webkit-backdrop-filter:blur(18px);
    }

    /* =========================
       Dashboard
    ========================= */

    .dashboard{
      display:none;
    }

    .dashboard.visible{
      display:block;
    }

    .page-title{
      margin-bottom:26px;
    }

    .page-title h1{
      margin:0 0 7px;

      font-size:
        clamp(38px,6vw,54px);

      line-height:1;

      letter-spacing:-.055em;

      color:#1b3449;
    }

    .page-title p{
      margin:0;

      color:var(--muted);

      font-size:13px;

      line-height:1.7;
    }

    /* =========================
       Grid
    ========================= */

    .grid{
      display:grid;

      grid-template-columns:
        1fr 1fr;

      gap:16px;
    }

    .card{
      padding:28px;

      border-radius:24px;
    }

    .card.full{
      grid-column:1 / -1;
    }

    .card-head{
      display:flex;

      align-items:flex-start;

      justify-content:space-between;

      gap:20px;

      margin-bottom:22px;
    }

    .card-title{
      margin:0;

      color:#294359;

      font-size:19px;
    }

    .card-desc{
      margin:5px 0 0;

      color:#8aa0b1;

      font-size:11px;

      line-height:1.6;
    }

    /* =========================
       Form
    ========================= */

    label{
      display:block;

      color:#527087;

      font-size:12px;

      margin-bottom:16px;
    }

    label span{
      color:#9aafbe;
    }

    input,
    textarea{
      display:block;

      width:100%;

      margin-top:8px;

      border:
        1px solid
        rgba(90,174,245,.18);

      border-radius:13px;

      background:
        rgba(255,255,255,.72);

      color:#263f53;

      padding:13px 14px;

      font:inherit;

      font-size:13px;

      outline:none;

      transition:.2s;
    }

    textarea{
      min-height:130px;

      resize:vertical;
    }

    input:focus,
    textarea:focus{
      border-color:
        rgba(74,168,255,.55);

      box-shadow:
        0 0 0 3px
        rgba(74,168,255,.08);
    }

    /* =========================
       Buttons
    ========================= */

    button{
      font:inherit;
    }

    .primary{
      border:0;

      border-radius:13px;

      padding:12px 18px;

      background:
        linear-gradient(
          135deg,
          #69c0fa,
          #4b9fe5
        );

      color:white;

      font-size:12px;

      font-weight:700;

      cursor:pointer;

      box-shadow:
        0 10px 28px
        rgba(24,121,220,.16);

      transition:.2s;
    }

    .primary:hover{
      filter:brightness(1.04);

      transform:translateY(-1px);
    }

    .secondary{
      border:
        1px solid
        rgba(90,174,245,.18);

      border-radius:11px;

      padding:9px 13px;

      background:
        rgba(255,255,255,.6);

      color:#5f829b;

      font-size:11px;

      cursor:pointer;

      transition:.2s;
    }

    .secondary:hover{
      background:
        rgba(90,174,245,.08);

      color:#328bd1;
    }

    .danger{
      border:
        1px solid
        rgba(232,121,121,.18);

      border-radius:11px;

      padding:9px 13px;

      background:
        rgba(232,121,121,.05);

      color:#c66f6f;

      font-size:11px;

      cursor:pointer;
    }

    .actions{
      display:flex;

      gap:8px;

      flex-wrap:wrap;
    }

    /* =========================
       Status
    ========================= */

    .status-preview{
      display:flex;

      align-items:center;

      gap:14px;

      padding:15px;

      margin-top:18px;

      border-radius:16px;

      background:
        rgba(90,174,245,.055);

      border:
        1px solid
        rgba(90,174,245,.10);
    }

    .status-dot{
      width:10px;
      height:10px;

      flex:0 0 10px;

      border-radius:50%;

      background:#55d5a4;

      box-shadow:
        0 0 14px
        rgba(85,213,164,.4);
    }

    .status-preview strong{
      display:block;

      font-size:13px;

      color:#365269;
    }

    .status-preview small{
      display:block;

      margin-top:3px;

      color:#8299aa;

      font-size:10px;
    }

    /* =========================
       Moments
    ========================= */

    .moments{
      display:grid;

      gap:12px;
    }

    .moment{
      display:grid;

      grid-template-columns:
        100px 1fr auto;

      align-items:center;

      gap:16px;

      padding:14px;

      border:
        1px solid
        rgba(90,174,245,.10);

      border-radius:17px;

      background:
        rgba(255,255,255,.42);
    }

    .moment-thumb{
      width:100px;
      height:75px;

      border-radius:11px;

      overflow:hidden;

      background:#edf6fb;
    }

    .moment-thumb img{
      width:100%;
      height:100%;

      display:block;

      object-fit:cover;
    }

    .moment-thumb.empty{
      display:grid;

      place-items:center;

      color:#a2b5c2;

      font-size:10px;
    }

    .moment-info h3{
      margin:0 0 5px;

      color:#365269;

      font-size:13px;
    }

    .moment-info p{
      margin:0;

      color:#8aa0b1;

      font-size:10px;

      line-height:1.6;

      display:-webkit-box;

      -webkit-line-clamp:2;

      -webkit-box-orient:vertical;

      overflow:hidden;
    }

    .moment-date{
      margin-bottom:5px;

      color:#70a5c9;

      font-size:9px;

      letter-spacing:.1em;
    }

    /* =========================
       Image upload
    ========================= */

    .upload{
      position:relative;

      display:block;

      padding:25px 18px;

      margin-top:8px;

      text-align:center;

      border:
        1px dashed
        rgba(90,174,245,.30);

      border-radius:15px;

      background:
        rgba(90,174,245,.035);

      color:#7695aa;

      cursor:pointer;
    }

    .upload:hover{
      background:
        rgba(90,174,245,.07);
    }

    .upload input{
      position:absolute;

      width:1px;
      height:1px;

      opacity:0;
    }

    .upload strong{
      display:block;

      color:#5b9ed0;

      font-size:13px;
    }

    .upload small{
      display:block;

      margin-top:5px;

      color:#99acba;

      font-size:9px;
    }

    .upload-preview{
      display:none;

      width:100%;

      max-height:220px;

      object-fit:cover;

      margin-top:12px;

      border-radius:14px;
    }

    /* =========================
       Message
    ========================= */

    .message{
      min-height:18px;

      margin-top:13px;

      font-size:11px;

      color:#7895aa;
    }

    .message.success{
      color:#4fae8b;
    }

    .message.error{
      color:#c66f6f;
    }

    /* =========================
       Logout
    ========================= */

    .logout{
      color:#8298a9;

      background:none;

      border:0;

      padding:4px;

      font-size:11px;

      cursor:pointer;
    }

    .logout:hover{
      color:#c66f6f;
    }

    /* =========================
       Mobile
    ========================= */

    @media(max-width:760px){

      .app{
        padding:
          22px 15px
          calc(45px + env(safe-area-inset-bottom));
      }

      .topbar{
        margin-bottom:24px;
      }

      .back{
        padding:9px 11px;

        font-size:10px;
      }

      .grid{
        grid-template-columns:1fr;
      }

      .card.full{
        grid-column:auto;
      }

      .card{
        padding:21px;

        border-radius:20px;
      }

      .page-title h1{
        font-size:40px;
      }

      .page-title p{
        font-size:11px;
      }

      .moment{
        grid-template-columns:
          72px 1fr;

        gap:12px;
      }

      .moment-thumb{
        width:72px;
        height:60px;
      }

      .moment .actions{
        grid-column:2;

        margin-top:-3px;
      }

      .login{
        margin-top:10vh;

        padding:25px;

        border-radius:22px;
      }

      .login h1{
        font-size:27px;
      }
    }

  </style>
</head>

<body>

  <div class="bg-orb orb-a"></div>
  <div class="bg-orb orb-b"></div>

  <!-- =========================
       Login
  ========================= -->

  <section id="loginView" class="login glass">

    <div class="brand">
      <div class="brand-mark">A</div>

      <div>
        <div class="brand-title">Afterain</div>
        <div class="brand-subtitle">
          PRIVATE SPACE
        </div>
      </div>
    </div>

    <div style="height:28px"></div>

    <h1>管理后台</h1>

    <p>
      这是你的私人管理空间。
      登录后可以修改状态、发布和管理动态。
    </p>

    <form id="loginForm">

      <label>
        管理密码

        <input
          id="password"
          type="password"
          autocomplete="current-password"
          placeholder="输入管理员密码"
          required
        >
      </label>

      <button
        class="primary"
        type="submit"
        style="width:100%"
      >
        登录
      </button>

      <div
        id="loginMessage"
        class="message"
      ></div>

    </form>

  </section>


  <!-- =========================
       Dashboard
  ========================= -->

  <main
    id="dashboard"
    class="dashboard"
  >

    <div class="app">

      <!-- Header -->

      <header class="topbar">

        <div class="brand">

          <div class="brand-mark">
            A
          </div>

          <div>
            <div class="brand-title">
              Afterain
            </div>

            <div class="brand-subtitle">
              ADMINISTRATION
            </div>
          </div>

        </div>

        <div class="actions">

          <a
            class="back"
            href="/"
          >
            ← 返回网站
          </a>

          <button
            id="logoutButton"
            class="logout"
            type="button"
          >
            退出
          </button>

        </div>

      </header>


      <div class="page-title">

        <h1>管理后台</h1>

        <p>
          在这里管理你的状态与照片动态。
        </p>

      </div>


      <div class="grid">

        <!-- =====================
             Status
        ====================== -->

        <section class="card glass">

          <div class="card-head">

            <div>

              <h2 class="card-title">
                当前状态
              </h2>

              <p class="card-desc">
                修改首页正在做什么。
              </p>

            </div>

          </div>


          <form id="statusForm">

            <label>

              状态标题

              <input
                id="statusTitle"
                type="text"
                maxlength="80"
                placeholder="例如：正在专心做自己的事情"
                required
              >

            </label>


            <label>

              状态说明

              <textarea
                id="statusDetail"
                maxlength="300"
                placeholder="简单说说你现在在做什么……"
                required
              ></textarea>

            </label>


            <button
              class="primary"
              type="submit"
            >
              保存状态
            </button>

            <div
              id="statusMessage"
              class="message"
            ></div>

          </form>


          <div class="status-preview">

            <span class="status-dot"></span>

            <div>

              <strong id="statusPreviewTitle">
                --
              </strong>

              <small id="statusPreviewDetail">
                --
              </small>

            </div>

          </div>

        </section>


        <!-- =====================
             New Moment
        ====================== -->

        <section class="card glass">

          <div class="card-head">

            <div>

              <h2 class="card-title">
                发布动态
              </h2>

              <p class="card-desc">
                留下一段值得记住的时间。
              </p>

            </div>

          </div>


          <form id="momentForm">

            <label>

              日期

              <input
                id="momentDate"
                type="date"
                required
              >

            </label>


            <label>

              标题

              <input
                id="momentTitle"
                type="text"
                maxlength="100"
                placeholder="这一天发生了什么？"
                required
              >

            </label>


            <label>

              图片

              <label class="upload">

                <input
                  id="momentImage"
                  type="file"
                  accept="image/*"
                >

                <strong>
                  ＋ 选择照片
                </strong>

                <small>
                  图片将上传到 Cloudinary
                </small>

              </label>

              <img
                id="imagePreview"
                class="upload-preview"
                alt=""
              >

            </label>


            <label>

              说明

              <textarea
                id="momentDescription"
                maxlength="500"
                placeholder="写下这张照片背后的故事……"
              ></textarea>

            </label>


            <button
              class="primary"
              type="submit"
            >
              发布动态
            </button>

            <div
              id="momentMessage"
              class="message"
            ></div>

          </form>

        </section>


        <!-- =====================
             Moments
        ====================== -->

        <section class="card glass full">

          <div class="card-head">

            <div>

              <h2 class="card-title">
                已发布动态
              </h2>

              <p class="card-desc">
                编辑或者删除已经发布的内容。
              </p>

            </div>

            <button
              id="refreshButton"
              class="secondary"
              type="button"
            >
              刷新
            </button>

          </div>


          <div
            id="moments"
            class="moments"
          >

            <div
              style="
                padding:30px;
                text-align:center;
                color:#91a8ba;
                font-size:12px;
              "
            >
              正在加载……
            </div>

          </div>

        </section>

      </div>

    </div>

  </main>


  <script>

    /*
     * =========================================
     * Afterain Admin
     * =========================================
     *
     * 后端 API：
     *
     * POST /api/admin/login
     * GET  /api/admin/status
     * PUT  /api/admin/status
     * GET  /api/admin/moments
     * POST /api/admin/moments
     * PUT  /api/admin/moments/:id
     * DELETE /api/admin/moments/:id
     *
     * Cloudinary：
     *
     * POST /api/admin/upload
     *
     * 后续 Worker 会实现这些接口。
     */


    const API = "/api/admin";


    /* =========================
       Elements
    ========================= */

    const loginView =
      document.getElementById("loginView");

    const dashboard =
      document.getElementById("dashboard");

    const loginForm =
      document.getElementById("loginForm");

    const passwordInput =
      document.getElementById("password");

    const loginMessage =
      document.getElementById("loginMessage");

    const statusForm =
      document.getElementById("statusForm");

    const statusTitle =
      document.getElementById("statusTitle");

    const statusDetail =
      document.getElementById("statusDetail");

    const statusMessage =
      document.getElementById("statusMessage");

    const statusPreviewTitle =
      document.getElementById(
        "statusPreviewTitle"
      );

    const statusPreviewDetail =
      document.getElementById(
        "statusPreviewDetail"
      );

    const momentForm =
      document.getElementById("momentForm");

    const momentDate =
      document.getElementById("momentDate");

    const momentTitle =
      document.getElementById("momentTitle");

    const momentImage =
      document.getElementById("momentImage");

    const momentDescription =
      document.getElementById(
        "momentDescription"
      );

    const momentMessage =
      document.getElementById(
        "momentMessage"
      );

    const imagePreview =
      document.getElementById(
        "imagePreview"
      );

    const moments =
      document.getElementById("moments");

    const refreshButton =
      document.getElementById(
        "refreshButton"
      );

    const logoutButton =
      document.getElementById(
        "logoutButton"
      );


    /* =========================
       Helpers
    ========================= */

    function showMessage(
      element,
      text,
      type=""
    ){

      element.textContent = text;

      element.className =
        "message" +
        (type ? ` ${type}` : "");

    }


    async function api(
      path,
      options={}
    ){

      const response =
        await fetch(
          API + path,
          {
            credentials:"include",
            ...options,
            headers:{
              "content-type":
                "application/json",
              ...(options.headers || {})
            }
          }
        );


      let data = null;

      try{
        data = await response.json();
      }catch{
        data = {};
      }


      if(
        response.status === 401
      ){

        logout();

        throw new Error(
          "登录已过期"
        );

      }


      if(!response.ok){

        throw new Error(
          data.error ||
          "请求失败"
        );

      }


      return data;

    }


    /* =========================
       Login
    ========================= */

    loginForm.addEventListener(
      "submit",
      async event => {

        event.preventDefault();

        showMessage(
          loginMessage,
          "正在登录……"
        );


        try{

          await api(
            "/login",
            {
              method:"POST",

              body:JSON.stringify({
                password:
                  passwordInput.value
              })
            }
          );


          passwordInput.value = "";

          loginView.style.display =
            "none";

          dashboard.classList.add(
            "visible"
          );


          await loadAll();


        }catch(error){

          showMessage(
            loginMessage,
            error.message,
            "error"
          );

        }

      }
    );


    /* =========================
       Status
    ========================= */

    async function loadStatus(){

      const data =
        await api("/status");


      const status =
        data.status || {};


      statusTitle.value =
        status.title || "";

      statusDetail.value =
        status.detail || "";


      statusPreviewTitle.textContent =
        status.title || "--";

      statusPreviewDetail.textContent =
        status.detail || "--";

    }


    statusForm.addEventListener(
      "submit",
      async event => {

        event.preventDefault();

        showMessage(
          statusMessage,
          "正在保存……"
        );


        try{

          await api(
            "/status",
            {
              method:"PUT",

              body:JSON.stringify({

                title:
                  statusTitle.value.trim(),

                detail:
                  statusDetail.value.trim()

              })
            }
          );


          showMessage(
            statusMessage,
            "状态已更新。",
            "success"
          );


          await loadStatus();


        }catch(error){

          showMessage(
            statusMessage,
            error.message,
            "error"
          );

        }

      }
    );


    /* =========================
       Image Preview
    ========================= */

    momentImage.addEventListener(
      "change",
      () => {

        const file =
          momentImage.files?.[0];


        if(!file){

          imagePreview.style.display =
            "none";

          imagePreview.src = "";

          return;

        }


        const url =
          URL.createObjectURL(file);


        imagePreview.src = url;

        imagePreview.style.display =
          "block";

      }
    );


    /* =========================
       Create Moment
    ========================= */

    momentForm.addEventListener(
      "submit",
      async event => {

        event.preventDefault();


        showMessage(
          momentMessage,
          "正在发布……"
        );


        try{

          let image = "";


          /*
           * 如果选择了图片，
           * 这里后续会上传到 Cloudinary。
           */

          const file =
            momentImage.files?.[0];


          if(file){

            image =
              await uploadImage(file);

          }


          await api(
            "/moments",
            {
              method:"POST",

              body:JSON.stringify({

                date:
                  momentDate.value,

                title:
                  momentTitle.value.trim(),

                description:
                  momentDescription.value.trim(),

                image

              })
            }
          );


          showMessage(
            momentMessage,
            "动态发布成功。",
            "success"
          );


          momentForm.reset();

          imagePreview.src = "";

          imagePreview.style.display =
            "none";


          await loadMoments();


        }catch(error){

          showMessage(
            momentMessage,
            error.message,
            "error"
          );

        }

      }
    );


    /* =========================
       Cloudinary
    ========================= */

    async function uploadImage(file){

      /*
       * 后续 Worker 实现：
       *
       * POST /api/admin/upload
       *
       * Worker 再把图片上传到
       * Cloudinary。
       */

      const form =
        new FormData();

      form.append(
        "file",
        file
      );


      const response =
        await fetch(
          API + "/upload",
          {
            method:"POST",

            credentials:"include",

            body:form
          }
        );


      const data =
        await response.json();


      if(!response.ok){

        throw new Error(
          data.error ||
          "图片上传失败"
        );

      }


      return data.url;

    }


    /* =========================
       Moments
    ========================= */

    async function loadMoments(){

      moments.innerHTML = `
        <div style="
          padding:30px;
          text-align:center;
          color:#91a8ba;
          font-size:12px;
        ">
          正在加载……
        </div>
      `;


      try{

        const data =
          await api("/moments");


        renderMoments(
          data.moments || []
        );


      }catch(error){

        moments.innerHTML = `
          <div style="
            padding:30px;
            text-align:center;
            color:#c66f6f;
            font-size:12px;
          ">
            ${escapeHtml(
              error.message
            )}
          </div>
        `;

      }

    }


    function renderMoments(list){

      if(!list.length){

        moments.innerHTML = `
          <div style="
            padding:35px;
            text-align:center;
            color:#91a8ba;
            font-size:12px;
          ">
            还没有发布任何动态。
          </div>
        `;

        return;

      }


      moments.innerHTML =
        list.map(moment => `

          <article class="moment">

            <div class="
              moment-thumb
              ${moment.image ? "" : "empty"}
            ">

              ${
                moment.image
                ? `
                  <img
                    src="${escapeAttribute(
                      moment.image
                    )}"
                    alt=""
                  >
                `
                : "无图片"
              }

            </div>


            <div class="moment-info">

              <div class="moment-date">
                ${escapeHtml(
                  moment.date || ""
                )}
              </div>

              <h3>
                ${escapeHtml(
                  moment.title || ""
                )}
              </h3>

              <p>
                ${escapeHtml(
                  moment.description || ""
                )}
              </p>

            </div>


            <div class="actions">

              <button
                class="danger"
                type="button"
                onclick="deleteMoment(
                  '${escapeAttribute(
                    moment.id
                  )}'
                )"
              >
                删除
              </button>

            </div>

          </article>

        `).join("");

    }


    async function deleteMoment(id){

      if(
        !confirm(
          "确定要删除这条动态吗？"
        )
      ){

        return;

      }


      try{

        await api(
          `/moments/${encodeURIComponent(id)}`,
          {
            method:"DELETE"
          }
        );


        await loadMoments();


      }catch(error){

        alert(
          error.message
        );

      }

    }


    /* =========================
       Refresh
    ========================= */

    refreshButton.addEventListener(
      "click",
      async () => {

        try{

          await loadAll();

        }catch(error){

          console.error(error);

        }

      }
    );


    async function loadAll(){

      await Promise.all([
        loadStatus(),
        loadMoments()
      ]);

    }


    /* =========================
       Logout
    ========================= */

    logoutButton.addEventListener(
      "click",
      logout
    );


    async function logout(){

      try{

        await fetch(
          API + "/logout",
          {
            method:"POST",
            credentials:"include"
          }
        );

      }catch{}

      dashboard.classList.remove(
        "visible"
      );

      loginView.style.display =
        "block";

    }


    /* =========================
       XSS Protection
    ========================= */

    function escapeHtml(value=""){

      return String(value)
        .replace(
          /[&<>"']/g,
          char => ({
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"
          }[char])
        );

    }


    function escapeAttribute(value=""){

      return escapeHtml(value)
        .replace(
          /`/g,
          "&#096;"
        );

    }


    /* =========================
       Default Date
    ========================= */

    const now =
      new Date();

    momentDate.value =
      now.toISOString()
        .slice(0,10);

  </script>

</body>
