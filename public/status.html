<html lang="zh-CN">
<head>
  <meta charset="utf-8">

  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">A</span><div><b>Afterain</b><small>PERSONAL SPACE</small></div></div>
    <button class="menu-toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="main-nav">☰</button>
    <nav id="main-nav">

      <div class="page-head"><p class="eyebrow">RIGHT NOW</p><h2>此时状态</h2><p>现实里的我，现在正在做什么。</p></div>
      <div class="status-card glass">
        <div class="status-ring"><span></span></div>
        <div><p class="eyebrow">CURRENT STATUS</p><h3 id="status-title">正在加载……</h3><p id="status-detail" class="muted">稍等一下。</p><time id="status-time"></time></div>
      </div>
      <div class="glass status-note"><span>✦</span><p>状态可以通过修改 <code>src/config.js</code> 随时更新，也可以接入你自己的 API。</p></div>
    </section>
  </main>

  <script src="/config.js"></script>
  <script src="/app.js"></script>
