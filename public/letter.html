<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>匿名信 · Afterain</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">A</span><div><b>Afterain</b><small>PERSONAL SPACE</small></div></div>
    <button class="menu-toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="main-nav">☰</button>
    <nav id="main-nav">
      <a class="nav-item" href="/">介绍</a>
      <a class="nav-item" href="/moments.html">照片动态</a>
      <a class="nav-item" href="/letter.html">匿名信</a>
      <a class="nav-item" href="/status.html">此时状态</a>
    </nav>
  </aside>

  <main class="content">
    <section class="page">
      <div class="page-head"><p class="eyebrow">ANONYMOUS LETTER</p><h2>匿名信</h2><p>想对我说点什么？不用留下名字。</p></div>
      <form id="letter-form" class="glass letter-form">
        <label>你的留言<textarea id="message" maxlength="2000" required placeholder="写下你想说的话……"></textarea></label>
        <div class="form-row"><label>回复邮箱 <span>（可选）</span><input id="replyTo" type="email" maxlength="120" placeholder="如果希望收到回复，可以留下邮箱"></label></div>
        <div class="hp" aria-hidden="true"><input id="website" tabindex="-1" autocomplete="off"></div>
        <button class="primary" type="submit">发送匿名信 <span>→</span></button>
        <p id="form-result" class="form-result"></p>
      </form>
    </section>
  </main>

  <script src="/config.js"></script>
  <script src="/app.js"></script>
</body>
</html>
